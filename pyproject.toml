[project]
name = "agent-coverage-tracker"
version = "0.1.0"
description = "Shows what a large agent search campaign covered, and why reruns diverge."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "biopython>=1.84",
    "duckdb>=1.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "protobuf>=4",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "transformers>=4.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/act"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
